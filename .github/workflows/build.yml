name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check helper script syntax
        run: npm run check

      - name: Check documented test counts
        run: npm run check:docs

      - name: Check version consistency
        run: npm run check:versions

      - name: Check localized resources
        run: npm run check:locales

      - name: Check documentation links
        run: npm run check:links

      - name: Check CI coverage
        run: npm run check:ci

      - name: Check command registrations
        run: npm run check:commands

      - name: Check capabilities
        run: npm run check:capabilities

      - name: Install the Tauri CLI
        run: npm ci

      - name: Run shell unit tests
        run: npm run test:unit

      - name: Install the DSH runtime
        run: npm install --prefix runtime @deepseek-ai/dsh

      - name: Check bridge contract drift
        run: npm run test:contract

      - name: Test the runtime contract
        timeout-minutes: 5
        run: npm run test:clean

      - name: Test the Rust shell
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust shell
        run: npm run lint:rust

      - name: Build the .deb and AppImage bundles
        run: npx tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-tauri-bundles
          # Cargo puts the workspace target under src-tauri/ unless CARGO_TARGET_DIR says otherwise.
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Attach the bundles to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          generate_release_notes: true
