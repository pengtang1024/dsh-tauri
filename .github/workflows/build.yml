name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the bridge scripts
        run: |
          node --check bridge/host-bridge.mjs
          node --check bridge/shell-api.mjs
          node --check bridge/renderer-shim.js

      - name: Install the Tauri CLI
        run: npm ci

      - name: Test the shell API
        run: npm test

      - name: Build the .deb and AppImage bundles
        run: npx tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-tauri-bundles
          # Cargo puts the workspace target under src-tauri/ unless CARGO_TARGET_DIR says otherwise.
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
