# Application permission manifest (Tauri 2 app ACL, the `__app-acl__` key).
#
# The main window loads the DSH web UI from the loopback service
# (`WebviewUrl::External` -> `http://127.0.0.1:<port>`), which Tauri 2.12 treats
# as a **remote** origin (webview/mod.rs::is_local_url). For a remote origin
# every application command is ACL-checked (webview/mod.rs::on_message), and a
# command without a permission entry is rejected at runtime with
# `Command <name> not allowed by ACL`. A capability can only reference
# permissions that exist in the application manifest, so the SHIM commands the
# injected script (`native.rs::SHIM`) and the boot splash (`dist/boot.html`)
# invoke are declared here, one permission per command, named like
# tauri-build's autogenerated ones (`allow-<command with dashes>`).
#
# tools/check-capabilities.mjs fails when a command invoked from the web content
# has no permission here, or is not granted by capabilities/default.json.

[[permission]]
identifier = "allow-pick-directory"
description = "Enables the pick_directory command (zenity folder chooser) for the DSH directory picker."
commands.allow = ["pick_directory"]

[[permission]]
identifier = "allow-clipboard-read"
description = "Enables the clipboard_read command (wl-paste) for the SHIM clipboard bridge."
commands.allow = ["clipboard_read"]

[[permission]]
identifier = "allow-clipboard-write"
description = "Enables the clipboard_write command (wl-copy) for the SHIM clipboard bridge."
commands.allow = ["clipboard_write"]

[[permission]]
identifier = "allow-open-external"
description = "Enables the open_external command (xdg-open) for links opened by the page."
commands.allow = ["open_external"]

[[permission]]
identifier = "allow-notify"
description = "Enables the notify command (notify-send) for page notifications."
commands.allow = ["notify"]

[[permission]]
identifier = "allow-set-title"
description = "Enables the set_title command, which mirrors document.title into the native title bar."
commands.allow = ["set_title"]

[[permission]]
identifier = "allow-shell-info"
description = "Enables the shell_info command, which reports the runtime/profile facts the page displays."
commands.allow = ["shell_info"]

[[permission]]
identifier = "allow-runtime-status"
description = "Enables the runtime_status command polled by the boot splash (dist/boot.html)."
commands.allow = ["runtime_status"]
