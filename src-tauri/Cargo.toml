[package]
name = "dsh-tauri"
version = "0.4.1"
edition = "2021"
rust-version = "1.80"
description = "Tauri 2 shell for DeepSeek Harness Desktop"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"
