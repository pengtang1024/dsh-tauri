[package]
name = "dsh-tauri"
version = "0.7.1"
edition = "2021"
rust-version = "1.80"
description = "Tauri 2 shell for DeepSeek Harness Desktop"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"

# Directory picker: a GTK3 folder dialog with hidden files and a path entry.
# gtk 0.18.x is already compiled for this target by tauri/wry (Cargo.lock has a
# single gtk 0.18.2 entry), so depending on it directly adds no build cost.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
