<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DSH Tauri</title>
    <style>
      :root { color-scheme: dark }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #0b0d12; color: #e6e8ee;
        font: 15px/1.65 ui-sans-serif, system-ui, "Noto Sans SC", sans-serif;
      }
      main { max-width: 620px; padding: 32px }
      h1 { margin: 0 0 12px; font-size: 19px; font-weight: 600 }
      p { margin: 0 0 14px; color: #a8b0c0 }
      pre {
        margin: 18px 0 0; padding: 14px 16px; overflow: auto; white-space: pre-wrap;
        background: #12151d; border: 1px solid #1e232e; border-radius: 10px;
        color: #d7dcea; font: 13px/1.5 ui-monospace, "JetBrains Mono", monospace;
      }
      code { background: #1a1f2a; padding: 1px 6px; border-radius: 5px; font-size: 13px }
    </style>
  </head>
  <body>
    <main>
      <h1>DSH 启动失败</h1>
      <p>外壳没能装好或启动 npm 运行时（<code>@deepseek-ai/dsh</code>）。下面是具体原因和可以手工执行的修复命令。</p>
      <p>修好之后重新启动应用即可；如果裸露的报错仍然看不懂，可以在终端里手动运行一次命令，观察完整输出。</p>
      <pre id="detail"></pre>
    </main>
    <script>
      function decodeErrorHash(hash) {
        if (!hash) return 'unknown error';
        let decoded;
        try {
          decoded = decodeURIComponent(hash);
        } catch {
          const preview = hash.slice(0, 200);
          return '无法解析错误信息（hash 含非法转义）；原始内容：' + preview;
        }
        return decoded || 'unknown error';
      }

      const detail = decodeErrorHash(location.hash.slice(1));
      document.getElementById('detail').textContent = detail;
    </script>
  </body>
</html>
